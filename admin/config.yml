backend:
  name: github
  repo: williammenard18-sudo/Oak-Ember-Kitchen
  branch: main

media_folder: "images/uploads"
public_folder: "/Oak-Ember-Kitchen/images/uploads"

collections:

  - name: "menu"
    label: "Menu"
    label_singular: "Menu Item"
    folder: "content/menu"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Item Name", name: "name", widget: "string"}
      - {label: "Price", name: "price", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Photo", name: "photo", widget: "image", required: false}
      - {label: "Available", name: "available", widget: "boolean", default: true}

  - name: "specials"
    label: "Specials & Deals"
    label_singular: "Special"
    folder: "content/specials"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Special Name", name: "name", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Price", name: "price", widget: "string"}
      - {label: "Day", name: "day", widget: "string"}
      - {label: "Photo", name: "photo", widget: "image", required: false}
      - {label: "Active", name: "active", widget: "boolean", default: true}

  - name: "reviews"
    label: "Reviews"
    label_singular: "Review"
    folder: "content/reviews"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Customer Name", name: "name", widget: "string"}
      - {label: "Review", name: "review", widget: "text"}
      - {label: "Rating", name: "rating", widget: "number", value_type: "int", min: 1, max: 5}
      - {label: "Date", name: "date", widget: "string"}
      - {label: "Featured", name: "featured", widget: "boolean", default: true}

  - name: "site"
    label: "Website Settings"
    files:

      - name: "general"
        label: "Business Information"
        file: "content/site/general.yml"
        fields:
          - {label: "Business Name", name: "business_name", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Address", name: "address", widget: "string"}
          - {label: "Phone", name: "phone", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Logo", name: "logo", widget: "image", required: false}
          - {label: "Favicon", name: "favicon", widget: "image", required: false}

      - name: "hours"
        label: "Business Hours"
        file: "content/site/hours.yml"
        fields:
          - {label: "Monday", name: "monday", widget: "string"}
          - {label: "Tuesday", name: "tuesday", widget: "string"}
          - {label: "Wednesday", name: "wednesday", widget: "string"}
          - {label: "Thursday", name: "thursday", widget: "string"}
          - {label: "Friday", name: "friday", widget: "string"}
          - {label: "Saturday", name: "saturday", widget: "string"}
          - {label: "Sunday", name: "sunday", widget: "string"}

      - name: "homepage"
        label: "Homepage"
        file: "content/site/homepage.yml"
        fields:
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Description", name: "hero_description", widget: "text"}
          - {label: "Hero Image", name: "hero_image", widget: "image", required: false}
          - {label: "About Title", name: "about_title", widget: "string"}
          - {label: "About Text", name: "about_text", widget: "text"}
          - {label: "About Image", name: "about_image", widget: "image", required: false}
